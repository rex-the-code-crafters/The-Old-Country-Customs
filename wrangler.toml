name = "the-old-country-customs"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Serve HTML with 5-min edge cache; images/fonts cached 1 year at edge
[assets.headers]
"Cache-Control" = "public, max-age=300, stale-while-revalidate=3600"
